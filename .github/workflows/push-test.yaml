on:
  push:
    branches-ignore: [main]
  pull_request:
env:
  DOCKER_BUILDKIT: 1
  BUILDKIT_INLINE_CACHE: 1
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v2
        with:
          persist-credentials: false
      - shell: bash
        run: make test
